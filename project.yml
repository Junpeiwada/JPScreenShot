name: JPScreenShot
options:
  bundleIdPrefix: com.soneru
  deploymentTarget:
    macOS: "26.0"
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    ARCHS: "$(ARCHS_STANDARD)"
    ENABLE_HARDENED_RUNTIME: YES
    # 画面収録権限（TCC）は署名の同一性に紐づく。ad-hoc 署名では
    # ビルドごとに CDHash が変わり、macOS が「別のアプリ」と見なすため
    # 許可が毎回リセットされる。開発用の署名 ID を固定して同一性を保つ。
    # 詳細は Docs/実装計画.md 1.3 を参照。
    CODE_SIGN_STYLE: Manual
    CODE_SIGN_IDENTITY: "Apple Development"
    DEVELOPMENT_TEAM: L897K2C26B

targets:
  JPScreenShot:
    type: application
    platform: macOS
    sources:
      - path: Sources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.soneru.JPScreenShot
        GENERATE_INFOPLIST_FILE: YES
        # Dock に出さずメニューバーのみに常駐する（非機能要求・常駐）
        INFOPLIST_KEY_LSUIElement: YES
        COMBINE_HIDPI_IMAGES: YES
        # App Sandbox は無効。デスクトップ保存（SAV-01）を追加の許可なしに
        # 動かすため。詳細は Docs/実装計画.md 8.1 を参照
        ENABLE_APP_SANDBOX: NO
