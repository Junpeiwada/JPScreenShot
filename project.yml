name: JPScreenShot
options:
  bundleIdPrefix: com.soneru
  deploymentTarget:
    macOS: "26.0"
  createIntermediateGroups: true
  # Xcode の「Update to recommended settings」警告を出さないため、
  # 最終アップグレード確認バージョンを現在の Xcode に合わせる。
  # Xcode 側のボタンで直すと .xcodeproj（生成物）が書き換わり、
  # 次の xcodegen generate で消えるので project.yml 側で指定する。
  xcodeVersion: "2650"

settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    # 以下は Xcode 26.5 の新規プロジェクトテンプレートが既定で入れる設定。
    # 未設定だと「推奨設定に更新」警告の対象になる。
    # （/Applications/Xcode.app/.../Base_ProjectSettings.xctemplate と差分を取って特定）
    #
    # Swift 6.2+ の Approachable Concurrency。nonisolated(nonsending) を
    # 既定にするなど、並行処理の記述を素直にする。
    SWIFT_APPROACHABLE_CONCURRENCY: YES
    # import したモジュールのメンバー可視性を厳密にする（Swift 7 で既定化予定）。
    SWIFT_UPCOMING_FEATURE_MEMBER_IMPORT_VISIBILITY: YES
    # ビルドスクリプトをサンドボックス内で実行する。
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    # ローカライズは String Catalog（.xcstrings）を優先する。
    LOCALIZATION_PREFERS_STRING_CATALOGS: YES
    # アセットカタログから Swift のシンボル拡張を生成する。
    ASSETCATALOG_COMPILER_GENERATE_SWIFT_ASSET_SYMBOL_EXTENSIONS: YES
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    ARCHS: "$(ARCHS_STANDARD)"
    ENABLE_HARDENED_RUNTIME: YES
    # 画面収録権限（TCC）は署名の同一性に紐づく。ad-hoc 署名では
    # ビルドごとに CDHash が変わり、macOS が「別のアプリ」と見なすため
    # 許可が毎回リセットされる。開発用の署名 ID を固定して同一性を保つ。
    # 詳細は Docs/実装計画.md 1.3 を参照。
    CODE_SIGN_STYLE: Manual
    CODE_SIGN_IDENTITY: "Apple Development"
    DEVELOPMENT_TEAM: L897K2C26B

targets:
  JPScreenShot:
    type: application
    platform: macOS
    sources:
      - path: Sources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.soneru.JPScreenShot
        GENERATE_INFOPLIST_FILE: YES
        # Dock に出さずメニューバーのみに常駐する（非機能要求・常駐）
        INFOPLIST_KEY_LSUIElement: YES
        COMBINE_HIDPI_IMAGES: YES
        # App Sandbox は無効。デスクトップ保存（SAV-01）を追加の許可なしに
        # 動かすため。詳細は Docs/実装計画.md 8.1 を参照
        ENABLE_APP_SANDBOX: NO

  # 純粋関数のテスト。画面もキャプチャ権限も不要な範囲だけを対象にする。
  JPScreenShotTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: Tests
    dependencies:
      - target: JPScreenShot
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.soneru.JPScreenShotTests
        GENERATE_INFOPLIST_FILE: YES
