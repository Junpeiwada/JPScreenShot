name: JPScreenShot
options:
  bundleIdPrefix: com.soneru
  deploymentTarget:
    macOS: "26.0"
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    ARCHS: "$(ARCHS_STANDARD)"
    CODE_SIGN_STYLE: Automatic
    ENABLE_HARDENED_RUNTIME: YES

targets:
  JPScreenShot:
    type: application
    platform: macOS
    sources:
      - path: Sources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.soneru.JPScreenShot
        GENERATE_INFOPLIST_FILE: YES
        # Dock に出さずメニューバーのみに常駐する（非機能要求・常駐）
        INFOPLIST_KEY_LSUIElement: YES
        COMBINE_HIDPI_IMAGES: YES
        # App Sandbox は無効。デスクトップ保存（SAV-01）を追加の許可なしに
        # 動かすため。詳細は Docs/実装計画.md 8.1 を参照
        ENABLE_APP_SANDBOX: NO
