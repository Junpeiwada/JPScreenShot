<svg xmlns="http://www.w3.org/2000/svg" width="980" height="470" viewBox="0 0 980 470" font-family="-apple-system, 'Hiragino Sans', 'Helvetica Neue', sans-serif">
  <defs>
    <filter id="winShadow" x="-10%" y="-10%" width="120%" height="130%"><feDropShadow dx="0" dy="6" stdDeviation="10" flood-opacity="0.25"/></filter>
    <filter id="annShadow" x="-20%" y="-20%" width="140%" height="160%"><feDropShadow dx="1.5" dy="2.5" stdDeviation="2" flood-opacity="0.45"/></filter>
  </defs>
  <rect width="980" height="470" fill="#fafafa"/>

  <!-- 結果ウィンドウ（今のまま＋「注釈を編集」） -->
  <g filter="url(#winShadow)"><rect x="20" y="60" width="340" height="300" rx="12" fill="#ececec" stroke="#22AEDB" stroke-width="3"/></g>
  <circle cx="38" cy="76" r="5" fill="#ff5f57"/><circle cx="54" cy="76" r="5" fill="#febc2e"/><circle cx="70" cy="76" r="5" fill="#28c840"/>
  <text x="190" y="80" text-anchor="middle" font-size="12" font-weight="600" fill="#333">結果ウィンドウ</text>
  <rect x="22" y="94" width="336" height="176" fill="#e1e1e1"/>
  <rect x="48" y="108" width="284" height="148" fill="#fff" stroke="#000" stroke-width="1.5"/>
  <rect x="48" y="108" width="284" height="18" fill="#2b3440"/>
  <rect x="64" y="140" width="160" height="7" rx="3.5" fill="#d3d8de"/><rect x="64" y="154" width="120" height="7" rx="3.5" fill="#d3d8de"/>
  <rect x="64" y="200" width="80" height="24" rx="6" fill="#2f7cf6"/>
  <rect x="22" y="270" width="336" height="30" fill="#fff"/>
  <rect x="32" y="276" width="100" height="18" rx="5" fill="#fff" stroke="#cfcfcf"/><text x="82" y="289" text-anchor="middle" font-size="10" fill="#333">テキストを認識</text>
  <rect x="22" y="300" width="336" height="58" rx="0" fill="#f2f2f2"/>
  <g font-size="10" fill="#333" text-anchor="middle">
    <rect x="32" y="314" width="66" height="20" rx="5" fill="#fff" stroke="#cfcfcf"/><text x="65" y="328">画像をコピー</text>
    <rect x="104" y="314" width="40" height="20" rx="5" fill="#fff" stroke="#cfcfcf"/><text x="124" y="328">保存</text>
    <rect x="150" y="312" width="86" height="24" rx="6" fill="#d5eefa" stroke="#1683b8" stroke-width="1.5"/><text x="193" y="328" fill="#1683b8" font-weight="700">✎ 注釈を編集…</text>
    <rect x="300" y="314" width="48" height="20" rx="5" fill="#fff" stroke="#cfcfcf"/><text x="324" y="328">閉じる</text>
  </g>

  <!-- 矢印 -->
  <path d="M240 340 C 300 420, 380 420, 400 330" fill="none" stroke="#7B61FF" stroke-width="2.5" stroke-dasharray="6 4"/>
  <polygon points="400,318 392,334 408,334" fill="#7B61FF"/>
  <text x="270" y="440" font-size="12" fill="#7B61FF">別ウィンドウで開く／完了で結果ウィンドウに反映</text>

  <!-- 編集ウィンドウ -->
  <g filter="url(#winShadow)"><rect x="400" y="20" width="560" height="400" rx="12" fill="#ececec" stroke="#bdbdbd" stroke-width="1"/></g>
  <circle cx="418" cy="36" r="5" fill="#ff5f57"/><circle cx="434" cy="36" r="5" fill="#febc2e"/><circle cx="450" cy="36" r="5" fill="#28c840"/>
  <text x="680" y="40" text-anchor="middle" font-size="12" font-weight="600" fill="#333">注釈の編集</text>
  <rect x="401" y="52" width="558" height="40" fill="#f6f6f6"/>
  <rect x="412" y="58" width="240" height="28" rx="6" fill="#fff" stroke="#cfcfcf"/>
  <g font-size="11" fill="#333" text-anchor="middle">
    <text x="427" y="76">⌖</text><text x="457" y="76">↗</text><text x="487" y="76">╱</text><text x="517" y="76">▭</text><text x="547" y="76">◯</text><text x="577" y="76" font-weight="800">A</text><text x="607" y="76">◍</text><text x="637" y="76">▦</text>
  </g>
  <circle cx="672" cy="72" r="9" fill="#FF3B30"/>
  <rect x="844" y="58" width="104" height="28" rx="6" fill="#2f7cf6"/><text x="896" y="76" text-anchor="middle" font-size="12" font-weight="600" fill="#fff">完了</text>
  <rect x="401" y="92" width="400" height="326" fill="#e1e1e1"/>
  <rect x="424" y="112" width="354" height="286" fill="#fff" stroke="#000" stroke-width="1.5"/>
  <rect x="424" y="112" width="354" height="24" fill="#2b3440"/>
  <rect x="444" y="156" width="200" height="8" rx="4" fill="#d3d8de"/><rect x="444" y="172" width="150" height="8" rx="4" fill="#d3d8de"/>
  <rect x="444" y="240" width="110" height="32" rx="7" fill="#2f7cf6"/>
  <rect x="436" y="232" width="126" height="48" rx="4" fill="none" stroke="#FF3B30" stroke-width="3.5" filter="url(#annShadow)"/>
  <text x="590" y="320" font-size="22" font-weight="800" fill="#fff" stroke="#111" stroke-width="5" stroke-linejoin="round" paint-order="stroke">ここ！</text>
  <rect x="801" y="92" width="158" height="326" fill="#f6f6f6"/>
  <line x1="801" y1="92" x2="801" y2="418" stroke="#d0d0d0"/>
  <text x="814" y="114" font-size="12" font-weight="700" fill="#222">インスペクタ</text>
  <rect x="814" y="128" width="132" height="8" rx="4" fill="#ddd"/><rect x="814" y="146" width="100" height="8" rx="4" fill="#ddd"/>
  <rect x="814" y="164" width="120" height="8" rx="4" fill="#ddd"/><rect x="814" y="182" width="90" height="8" rx="4" fill="#ddd"/>
</svg>
