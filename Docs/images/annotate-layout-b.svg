  <path d="M3 510 H897 V544 a13 13 0 0 1 -13 13 H16 a13 13 0 0 1 -13 -13 Z" fill="#f2f2f2"/>
  <line x1="3" y1="510" x2="897" y2="510" stroke="#d0d0d0"/>
  <g font-size="12" fill="#333" text-anchor="middle">
    <rect x="14" y="521" width="118" height="24" rx="6" fill="#fff" stroke="#cfcfcf"/><text x="73" y="537">＋ 新規キャプチャ</text>
    <rect x="152" y="521" width="96" height="24" rx="6" fill="#fff" stroke="#cfcfcf"/><text x="200" y="537">画像をコピー</text>
    <rect x="256" y="521" width="56" height="24" rx="6" fill="#fff" stroke="#cfcfcf"/><text x="284" y="537">保存</text>
    <rect x="322" y="521" width="56" height="24" rx="6" fill="#fff" stroke="#cfcfcf"/><text x="350" y="537">↶ ↷</text>
    <text x="682" y="537">☑ 等倍</text>
    <text x="770" y="537" font-size="11" fill="#888">1480 × 740</text>
    <rect x="824" y="521" width="62" height="24" rx="6" fill="#fff" stroke="#cfcfcf"/><text x="855" y="537">閉じる</text>
  </g>

  <g font-size="12" font-weight="700" fill="#fff" text-anchor="middle">
    <circle cx="66" cy="52" r="11" fill="#7B61FF"/><text x="66" y="56">1</text>
    <circle cx="66" cy="410" r="11" fill="#7B61FF"/><text x="66" y="414">2</text>
    <circle cx="296" cy="236" r="11" fill="#7B61FF"/><text x="296" y="240">3</text>
  </g>
