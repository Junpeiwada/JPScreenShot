  <rect x="12" y="342" width="40" height="36" rx="7" fill="#fff" stroke="#e0e0e0"/>
  <g>
    <rect x="25" y="353" width="5" height="5" fill="#555"/><rect x="30" y="353" width="5" height="5" fill="#aaa"/><rect x="35" y="353" width="5" height="5" fill="#777"/>
    <rect x="25" y="358" width="5" height="5" fill="#999"/><rect x="30" y="358" width="5" height="5" fill="#444"/><rect x="35" y="358" width="5" height="5" fill="#bbb"/>
    <rect x="25" y="363" width="5" height="5" fill="#666"/><rect x="30" y="363" width="5" height="5" fill="#ccc"/><rect x="35" y="363" width="5" height="5" fill="#888"/>
