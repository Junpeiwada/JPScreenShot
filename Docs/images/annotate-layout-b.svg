    <filter id="annShadow" x="-20%" y="-20%" width="140%" height="160%"><feDropShadow dx="1.5" dy="2.5" stdDeviation="2" flood-opacity="0.45"/></filter>
    <filter id="popShadow" x="-10%" y="-10%" width="120%" height="140%"><feDropShadow dx="0" dy="4" stdDeviation="8" flood-opacity="0.25"/></filter>
  </defs>

  <rect x="1.5" y="1.5" width="897" height="557" rx="14" fill="#ececec" stroke="#22AEDB" stroke-width="3"/>
