  <rect x="12" y="216" width="40" height="36" rx="7" fill="#fff" stroke="#e0e0e0"/>
  <ellipse cx="32" cy="234" rx="8" ry="7" fill="none" stroke="#333" stroke-width="2"/>
  <rect x="12" y="258" width="40" height="36" rx="7" fill="#d5eefa" stroke="#9fd2ec"/>
  <text x="32" y="283" text-anchor="middle" font-size="18" font-weight="800" fill="#fff" stroke="#1683b8" stroke-width="2" paint-order="stroke">A</text>
