  <rect x="140" y="268" width="660" height="44" rx="8" fill="#f3f4f6"/>
  <text x="158" y="295" font-size="13" fill="#222">プッシュ通知</text>
  <rect x="740" y="281" width="40" height="20" rx="10" fill="#34C759"/><circle cx="769" cy="291" r="8" fill="#fff"/>
  <rect x="140" y="340" width="420" height="8" rx="4" fill="#e3e6ea"/>
  <rect x="140" y="356" width="360" height="8" rx="4" fill="#e3e6ea"/>

  <!-- 注釈 -->
  <rect x="728" y="219" width="64" height="36" rx="6" fill="none" stroke="#FF3B30" stroke-width="4" filter="url(#annShadow)"/>
  <g filter="url(#annShadow)">
