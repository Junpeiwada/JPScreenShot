  <rect x="12" y="90" width="40" height="36" rx="7" fill="#fff" stroke="#e0e0e0"/>
  <line x1="24" y1="116" x2="37" y2="102" stroke="#333" stroke-width="2"/><polygon points="41,98 32,100 39,107" fill="#333"/>
