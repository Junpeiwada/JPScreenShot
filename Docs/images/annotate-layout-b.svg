  <rect x="538" y="246" width="58" height="20" rx="5" fill="#fff" stroke="#cfcfcf"/>
  <text x="560" y="260" text-anchor="middle" font-size="11" fill="#333">30 pt</text><text x="588" y="260" font-size="9" fill="#666">⇕</text>
  <text x="606" y="260" font-size="11" fill="#666">影</text>
  <rect x="624" y="248" width="30" height="16" rx="8" fill="#34C759"/><circle cx="646" cy="256" r="6" fill="#fff"/>
  <text x="306" y="292" font-size="11" fill="#666">文字色</text>
  <circle cx="374" cy="288" r="11" fill="none" stroke="#1683b8" stroke-width="2"/>
  <circle cx="374" cy="288" r="8" fill="#fff" stroke="#bbb"/><circle cx="398" cy="288" r="8" fill="#111"/><circle cx="422" cy="288" r="8" fill="#FF3B30"/><circle cx="446" cy="288" r="8" fill="#FFCC00"/><circle cx="470" cy="288" r="8" fill="#007AFF"/><circle cx="494" cy="288" r="8" fill="#34C759"/>
  <text x="306" y="322" font-size="11" fill="#666">縁の色</text>
  <circle cx="398" cy="318" r="11" fill="none" stroke="#1683b8" stroke-width="2"/>
  <circle cx="374" cy="318" r="8" fill="#fff" stroke="#bbb"/><circle cx="398" cy="318" r="8" fill="#111"/><circle cx="422" cy="318" r="8" fill="#FF3B30"/><circle cx="446" cy="318" r="8" fill="#FFCC00"/><circle cx="470" cy="318" r="8" fill="#007AFF"/><circle cx="494" cy="318" r="8" fill="#34C759"/>
  <text x="306" y="352" font-size="11" fill="#666">縁の太さ</text>
  <line x1="374" y1="348" x2="620" y2="348" stroke="#c8c8c8" stroke-width="4" stroke-linecap="round"/>
  <line x1="374" y1="348" x2="450" y2="348" stroke="#1683b8" stroke-width="4" stroke-linecap="round"/>
  <circle cx="450" cy="348" r="7" fill="#fff" stroke="#bbb"/>
  <text x="680" y="352" text-anchor="end" font-size="11" fill="#333">7 pt</text>

  <!-- OCR バー・ボタンバー（現状どおり） -->
  <rect x="3" y="470" width="894" height="40" fill="#fff"/>
  <line x1="3" y1="470" x2="897" y2="470" stroke="#d0d0d0"/>
  <rect x="14" y="479" width="130" height="22" rx="6" fill="#fff" stroke="#cfcfcf"/>
