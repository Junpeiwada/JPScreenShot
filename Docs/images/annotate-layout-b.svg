    <path d="M300 236 H700 a10 10 0 0 1 10 10 V362 a10 10 0 0 1 -10 10 H560 L547 382 L534 372 H300 a10 10 0 0 1 -10 -10 V246 a10 10 0 0 1 10 -10 Z" fill="#fbfbfb" stroke="#d0d0d0"/>
