  <circle cx="404" cy="310" r="11" fill="none" stroke="#1683b8" stroke-width="2"/>
  <circle cx="378" cy="310" r="8" fill="#fff" stroke="#bbb"/><circle cx="404" cy="310" r="8" fill="#111"/><circle cx="430" cy="310" r="8" fill="#FF3B30"/><circle cx="456" cy="310" r="8" fill="#007AFF"/><circle cx="482" cy="310" r="8" fill="#fff" stroke="#bbb"/><text x="482" y="314" text-anchor="middle" font-size="12" fill="#666">+</text>
