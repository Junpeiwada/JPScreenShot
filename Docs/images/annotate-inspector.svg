  <g>
    <rect x="612" y="270" width="16" height="16" fill="#d3d8de"/><rect x="628" y="270" width="16" height="16" fill="#555"/><rect x="644" y="270" width="16" height="16" fill="#aaa"/><rect x="660" y="270" width="16" height="16" fill="#777"/><rect x="676" y="270" width="16" height="16" fill="#ccc"/><rect x="692" y="270" width="16" height="16" fill="#666"/><rect x="708" y="270" width="16" height="16" fill="#bbb"/><rect x="724" y="270" width="16" height="16" fill="#888"/><rect x="740" y="270" width="16" height="16" fill="#e2e2e2"/><rect x="756" y="270" width="16" height="16" fill="#999"/><rect x="772" y="270" width="16" height="16" fill="#ddd"/><rect x="788" y="270" width="16" height="16" fill="#777"/>
    <rect x="612" y="286" width="16" height="16" fill="#aaa"/><rect x="628" y="286" width="16" height="16" fill="#ccc"/><rect x="644" y="286" width="16" height="16" fill="#666"/><rect x="660" y="286" width="16" height="16" fill="#bbb"/><rect x="676" y="286" width="16" height="16" fill="#888"/><rect x="692" y="286" width="16" height="16" fill="#ddd"/><rect x="708" y="286" width="16" height="16" fill="#777"/><rect x="724" y="286" width="16" height="16" fill="#aaa"/><rect x="740" y="286" width="16" height="16" fill="#555"/><rect x="756" y="286" width="16" height="16" fill="#ccc"/><rect x="772" y="286" width="16" height="16" fill="#999"/><rect x="788" y="286" width="16" height="16" fill="#bbb"/>
    <rect x="612" y="302" width="16" height="16" fill="#e2e2e2"/><rect x="628" y="302" width="16" height="16" fill="#999"/><rect x="644" y="302" width="16" height="16" fill="#ddd"/><rect x="660" y="302" width="16" height="16" fill="#e2e2e2"/><rect x="676" y="302" width="16" height="16" fill="#bbb"/><rect x="692" y="302" width="16" height="16" fill="#e2e2e2"/><rect x="708" y="302" width="16" height="16" fill="#ccc"/><rect x="724" y="302" width="16" height="16" fill="#e2e2e2"/><rect x="740" y="302" width="16" height="16" fill="#ddd"/><rect x="756" y="302" width="16" height="16" fill="#e2e2e2"/><rect x="772" y="302" width="16" height="16" fill="#ccc"/><rect x="788" y="302" width="16" height="16" fill="#e2e2e2"/>
