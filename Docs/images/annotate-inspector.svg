  <text x="596" y="366" font-size="11" fill="#666">枠線</text>
  <rect x="788" y="354" width="34" height="18" rx="9" fill="#c8c8c8"/><circle cx="797" cy="363" r="7" fill="#fff"/>
  <text x="596" y="404" font-size="10" fill="#999">・色・太さ・影の設定は持たない</text>
  <text x="596" y="422" font-size="10" fill="#999">・中身は元画像から毎回計算し直す</text>
  <text x="596" y="440" font-size="10" fill="#999">・強さの最小値は人の目で読めない程度に</text>
  <text x="596" y="458" font-size="10" fill="#999">　制限する（ぼかし不足の事故防止）</text>
